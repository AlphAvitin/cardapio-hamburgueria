<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hamburgueria Premium</title>
    <style>
        body { background: #142722; color: #F4EFE1; font-family: sans-serif; margin: 0; padding-bottom: 100px; }
        .item { display: flex; align-items: center; justify-content: space-between; padding: 15px; border-bottom: 1px solid #333; }
        .qty-btn { background: #FFB627; border: none; padding: 10px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: center; }
        .modal { background: #1C332C; padding: 20px; border-radius: 10px; width: 80%; text-align: center; }
        .confirm-btn { background: #FFB627; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

    <h1 style="text-align: center; margin: 20px 0;">Hamburgueria Premium</h1>

    <div class="item">
        <div>
            <h3>Premium Clássico</h3>
            <p>R$ 22,00</p>
        </div>
        <!-- Chamada direta para teste -->
        <button class="qty-btn" onclick="openTestModal('Premium Clássico')">+</button>
    </div>

    <!-- Modal de Teste -->
    <div id="testModal" class="overlay">
        <div class="modal">
            <h2 id="modalTitle">Item</h2>
            <p>Se você está vendo isso, o código funciona!</p>
            <button class="confirm-btn" onclick="closeTestModal()">Fechar</button>
        </div>
    </div>

    <script>
        // Funções globais forçadas
        window.openTestModal = function(nome) {
            console.log("Abrindo modal para: " + nome);
            document.getElementById('modalTitle').textContent = nome;
            document.getElementById('testModal').style.display = 'flex';
        };

        window.closeTestModal = function() {
            document.getElementById('testModal').style.display = 'none';
        };
    </script>
</body>
</html>
